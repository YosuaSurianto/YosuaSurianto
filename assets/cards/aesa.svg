  </radialGradient>
</defs>
<style>
  .k { font: 700 11px 'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace; letter-spacing: 2px; fill: #5EB8FF; }
  .t { font: 800 30px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #EAF4FF; }
  .g { font: 600 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #A9C7E8; }
  .d { font: 400 13.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #7F93B2; }
