    <stop offset="0" stop-color="#0D1526"/><stop offset="1" stop-color="#070B14"/>
  </linearGradient>
  <radialGradient id="glowpolysui" cx="0.9" cy="0" r="0.8">
    <stop offset="0" stop-color="#5EB8FF" stop-opacity=".18"/><stop offset="1" stop-color="#5EB8FF" stop-opacity="0"/>
  </radialGradient>
</defs>
<style>
