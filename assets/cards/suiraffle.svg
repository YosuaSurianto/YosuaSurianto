<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img" aria-label="SuiRaffle: Tamper-proof on-chain raffles">
<title>SuiRaffle: Tamper-proof on-chain raffles</title>
<defs>
