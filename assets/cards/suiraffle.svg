</style>
<rect x="1" y="1" width="478" height="268" rx="16" fill="url(#bgsuiraffle)" stroke="#1B2A44" stroke-width="1.5"/>
<rect x="1" y="1" width="478" height="268" rx="16" fill="url(#glowsuiraffle)"/>
<rect x="28" y="1" width="96" height="2" rx="1" fill="#5EB8FF"/>
